<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Accountability Chart — July 1, 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Code+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F2;
    --card-bg: #FFFFFF;
    --card-border: #E8E5E0;
    --text-primary: #2D2A26;
    --text-secondary: #4A4642;
    --text-muted: #8A857D;
    --text-faint: #B5B0A8;
    --accent: #5B7B6A;
    --ai-accent: #2F6F4F;
    --ai-accent-bg: #E8F1EC;
    --manual-accent: #B07A4A;
    --manual-accent-bg: #F3EAE0;
    --paused-accent: #9B968E;
    --paused-accent-bg: #EFEDE9;
    --divider-light: #E8E5E0;
    --hiring-bg: #F7F5F2;
    --sidebar-width: 380px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    background: var(--bg);
  }
  #viewport.grabbing { cursor: grabbing; }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }
  #canvas.panning { will-change: transform; }
  .hud {
    position: fixed;
    bottom: 20px; left: 20px;
    display: flex; gap: 8px;
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 20;
  }
  .hud button {
    background: var(--card-bg);
    border: 1px solid var(--divider-light);
    color: var(--text-muted);
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .hud button:hover { border-color: var(--accent); color: var(--accent); }
  .hud .zoom-readout {
    background: var(--card-bg);
    border: 1px solid var(--divider-light);
    padding: 6px 12px;
    min-width: 64px;
    text-align: center;
  }
  .card {
    position: absolute;
    width: 220px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 2px;
    padding: 12px;
    box-sizing: border-box;
    font-size: 12px;
    line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: border-color 0.2s, opacity 0.3s, box-shadow 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card.selected {
    border-color: var(--ai-accent);
    box-shadow: 0 0 0 2px var(--ai-accent-bg);
  }
  /* Episode-highlight mode */
  body.highlight-mode .card { opacity: 0.25; }
  body.highlight-mode .card.ep-highlighted { opacity: 1; }
  body.highlight-mode .card.ep-highlighted {
    border-color: var(--ai-accent);
    box-shadow: 0 0 0 2px var(--ai-accent-bg);
  }
  body.highlight-mode .card.ep-conductor {
    border: 2px solid var(--ai-accent);
  }
  body.highlight-mode svg.connectors path { opacity: 0.08 !important; }
  .card.hiring {
    background: var(--hiring-bg);
    border: 1px dashed var(--accent);
  }
  /* Seat-level paused — faded when the Paused label is OFF; toggling Paused
     ON brings the box back to full opacity (and shows its badge). */
  body.hide-paused .card.seat-paused { opacity: 0.5; }
  /* While a paused box is faded, hide its inner status badges too — they're
     distracting bleeding through the transparency. They return when Paused is
     toggled on and the box comes back to full opacity. */
  body.hide-paused .card.seat-paused .acc-ai-mark,
  body.hide-paused .card.seat-paused .acc-manual-mark,
  body.hide-paused .card.seat-paused .acc-paused-mark { display: none; }
  .card-header { margin-bottom: 8px; }
  .who .title {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    line-height: 1.25;
  }
  .who .name {
    font-family: 'Source Code Pro', monospace;
    font-weight: 400;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.3px;
    margin-top: 4px;
  }
  .market {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .section-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 4px;
  }
  .accountabilities {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .accountabilities li {
    padding: 2px 0;
    padding-left: 10px;
    position: relative;
    line-height: 1.45;
  }
  .accountabilities li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 600;
  }
  .acc-ai-mark,
  .acc-manual-mark,
  .acc-paused-mark {
    display: inline-block;
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #fff;
    background: var(--ai-accent);
    padding: 1px 6px;
    border-radius: 1px;
    margin-left: 6px;
    text-transform: uppercase;
    vertical-align: 1px;
  }
  /* MANUAL = still human: solid clay */
  .acc-manual-mark { background: var(--manual-accent); }
  /* PAUSED = dormant: hollow grey */
  .acc-paused-mark {
    background: transparent;
    color: var(--paused-accent);
    border: 1px solid var(--paused-accent);
    padding: 0 5px;
  }
  /* A wholly-paused accountability line fades when Paused is OFF. */
  body.hide-paused .accountabilities li.paused { opacity: 0.5; }
  /* Light "moved here" provenance affordance — not a work-state badge. */
  .acc-moved-mark {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--text-faint);
    margin-left: 6px;
    white-space: nowrap;
  }
  .kpis {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .meta {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--divider-light);
    letter-spacing: 0.3px;
    line-height: 1.5;
  }
  .hiring .who .title { color: var(--accent); }
  .hiring .who .name { color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
  svg.connectors { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; }
  .card { z-index: 1; }
  .header-banner {
    position: fixed;
    top: 20px; left: 20px;
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 8px 14px;
    background: var(--card-bg);
    border: 1px solid var(--divider-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 20;
  }
  .header-banner .accent { color: var(--accent); }
  .header-banner .mode-tab { cursor: pointer; color: var(--text-faint); transition: color 0.2s; }
  .header-banner .mode-tab:hover { color: var(--accent); }
  .header-banner .mode-tab.active { color: var(--text-primary); }
  /* Org mode: contractors / non-FTE read as a dashed box + a small tag. */
  .card.contractor { border-style: dashed; }
  .emp-tag {
    display: inline-block;
    margin-left: 8px;
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--divider-light);
    padding: 1px 5px;
    border-radius: 1px;
  }

  /* ─── Top-right control stack ─── */
  .controls-tray {
    position: fixed;
    top: 20px; right: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 18px;
    z-index: 20;
  }
  .ep-pill-tray, .label-toggle-tray {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .label-toggle-tray .tray-label,
  .ep-pill-tray .tray-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .ep-pill {
    background: var(--card-bg);
    border: 1px solid var(--divider-light);
    color: var(--text-secondary);
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }
  .ep-pill:hover { border-color: var(--ai-accent); color: var(--ai-accent); }
  .ep-pill.active {
    background: var(--ai-accent);
    border-color: var(--ai-accent);
    color: #fff;
  }
  .ep-pill .pill-tag {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    margin-right: 8px;
    text-transform: uppercase;
  }
  .ep-pill.active .pill-tag { color: rgba(255,255,255,0.7); }

  /* ─── Label-visibility toggles ───
     One toggle per status label. ON shows the badge in its own color;
     OFF hides every badge of that status (bullets + text untouched).
     Generalized — add a row to STATUS_TOGGLES to wire another label. */
  .label-toggle {
    background: var(--card-bg);
    border: 1px solid var(--divider-light);
    color: var(--text-faint);
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s, opacity 0.2s;
  }
  .label-toggle .toggle-state {
    font-size: 9px;
    letter-spacing: 1px;
    margin-left: 8px;
    opacity: 0.7;
  }
  .label-toggle.on { color: var(--text-primary); border-color: var(--text-muted); }
  .label-toggle.off { opacity: 0.6; }

  /* Hiding a label removes only its badges, everywhere it appears. */
  body.hide-ai     .acc-ai-mark,     body.hide-ai     .sb-aified-badge { display: none; }
  body.hide-manual .acc-manual-mark, body.hide-manual .sb-manual-badge { display: none; }
  body.hide-paused .acc-paused-mark, body.hide-paused .sb-paused-badge { display: none; }

  /* ─── Sidebar (right edge) ─── */
  .sidebar {
    position: fixed;
    top: 0; right: 0;
    width: var(--sidebar-width);
    height: 100vh;
    background: var(--card-bg);
    border-left: 1px solid var(--card-border);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    overflow-y: auto;
    padding: 32px 28px 60px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar .close-btn {
    position: absolute;
    top: 14px; right: 14px;
    background: transparent;
    border: none;
    font-family: 'Source Code Pro', monospace;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 10px;
    transition: color 0.2s;
  }
  .sidebar .close-btn:hover { color: var(--text-primary); }

  .sb-seat-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  /* Per-role section header inside a person's (org-mode) sidebar */
  .sb-role-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 26px 0 6px;
  }
  .sb-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  .sb-occupant {
    font-family: 'Source Code Pro', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }
  .sb-meta {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--divider-light);
    letter-spacing: 0.5px;
    line-height: 1.7;
  }

  .sb-ep-banner {
    background: var(--ai-accent-bg);
    border-left: 2px solid var(--ai-accent);
    padding: 10px 12px;
    margin-top: 18px;
    border-radius: 1px;
  }
  .sb-ep-banner .ep-tag {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--ai-accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sb-ep-banner .ep-text {
    font-size: 12px;
    color: var(--text-primary);
    line-height: 1.5;
  }
  .sb-ep-banner .ep-text strong { font-weight: 600; }

  .sb-acc-block {
    margin-top: 28px;
  }
  .sb-acc-row {
    border-top: 1px solid var(--divider-light);
    padding: 16px 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .sb-acc-row:first-of-type { border-top: 1px solid var(--accent); }
  .sb-acc-row:last-of-type { border-bottom: 1px solid var(--divider-light); }
  .sb-acc-row:hover .sb-acc-name { color: var(--accent); }
  .sb-acc-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    transition: color 0.2s;
  }
  .sb-sub-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .sb-sub-items.revealed { max-height: 800px; }
  .sb-sub-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0 7px 4px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.55;
  }
  .sb-sub-item:first-child { padding-top: 12px; }
  .sb-sub-item .arrow {
    font-family: 'Source Code Pro', monospace;
    color: var(--accent);
    flex-shrink: 0;
    font-size: 12px;
  }
  .sb-sub-item.aified .arrow { color: var(--ai-accent); }
  .sb-sub-item.aified .sub-name {
    font-weight: 600;
    color: var(--text-primary);
  }
  /* MANUAL subtask — still human-held */
  .sb-sub-item.manual .arrow { color: var(--manual-accent); }
  .sb-sub-item.manual .sub-name {
    font-weight: 600;
    color: var(--text-primary);
  }
  /* PAUSED subtask — kept on the record, not active.
     Strike only the name, never the badge sitting next to it. */
  body.hide-paused .sb-sub-item.paused { opacity: 0.5; }
  .sb-sub-item.paused .arrow { color: var(--paused-accent); }
  .sb-sub-item.paused .sub-name {
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--paused-accent);
  }
  /* A wholly-paused accountability row in the side panel fades when Paused is OFF */
  body.hide-paused .sb-acc-row.paused .sb-acc-name { opacity: 0.5; }
  .sb-aified-badge,
  .sb-manual-badge,
  .sb-paused-badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #fff;
    background: var(--ai-accent);
    border: 1px solid var(--ai-accent);
    padding: 2px 7px;
    border-radius: 1px;
    margin-left: 8px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sb-manual-badge { background: var(--manual-accent); border-color: var(--manual-accent); }
  .sb-paused-badge {
    background: transparent;
    color: var(--paused-accent);
    border-color: var(--paused-accent);
  }
  .sb-sub-note {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    color: var(--ai-accent);
    padding: 2px 0 2px 22px;
    letter-spacing: 0.3px;
    line-height: 1.5;
  }
  .sb-sub-note.manual { color: var(--manual-accent); }
  .sb-sub-note.paused { color: var(--paused-accent); }
  /* "Moved here" affordance in the side panel — light, italic provenance note. */
  .sb-moved-mark {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--text-faint);
    margin-left: 8px;
    white-space: nowrap;
  }
  .sb-moved-note {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    color: var(--text-faint);
    font-style: italic;
    letter-spacing: 0.3px;
    padding: 4px 0 0 4px;
  }
  /* "Covered on" episode links under a subtask */
  .sb-ep-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding: 4px 0 2px 22px;
  }
  .sb-ep-links-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .sb-ep-link {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--ai-accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  a.sb-ep-link:hover { border-bottom-color: var(--ai-accent); }
  .sb-ep-link.disabled { color: var(--text-faint); font-weight: 400; cursor: default; }
  .sb-ep-link .ep-link-state { letter-spacing: 0.3px; }
  .sb-kpis {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--divider-light);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  .sb-kpis .label {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="header-banner"><span class="mode-tab active" id="tab-accountability" onclick="switchMode('accountability')">Accountability</span> <span class="mode-tab" id="tab-org" onclick="switchMode('org')">Org</span> · <span class="accent">2024.07.01</span> · <span id="node-count">52 seats</span></div>
<div id="viewport">
  <div id="canvas"></div>
</div>
<div class="hud">
  <button onclick="zoomBy(1.2)">+</button>
  <button onclick="zoomBy(1/1.2)">−</button>
  <div class="zoom-readout" id="zoom-readout">100%</div>
  <button onclick="fitToScreen()">Fit</button>
  <button onclick="resetView()">100%</button>
</div>

<!-- Top-right control stack: label toggles + episode highlights -->
<div class="controls-tray">
  <!-- Label-visibility toggles -->
  <div class="label-toggle-tray" id="label-toggle-tray">
    <div class="tray-label">Labels</div>
    <!-- Toggles injected by JS from STATUS_TOGGLES -->
  </div>
  <!-- Episode highlight pills -->
  <div class="ep-pill-tray" id="ep-pill-tray">
    <div class="tray-label">Redacted episodes</div>
    <!-- Pills injected by JS from EPISODE_HIGHLIGHTS -->
  </div>
</div>

<!-- Detail sidebar -->
<aside class="sidebar" id="sidebar">
  <button class="close-btn" onclick="closeSidebar()">×</button>
  <div id="sidebar-body"><!-- populated on seat click --></div>
</aside>

<script>
const OCCUPANTS = {
  david_shaner: "David S",
  steve_l: "Steve L",
  hannah_d: "Hannah D",
  annalaura_cromwell: "AnnaLaura Cromwell",
  ramy_kerdany: "Ramy Kerdany",
  taylor_cotner: "Taylor Cotner",
  verso_lalto: "Verso L'Alto",
  fourscore_smith_anderson: "Fourscore / Smith Anderson",
  kristen_taber: "Kristen Taber",
  alex_quan: "Alex Quan",
  m[REDACTED]nn_gray: "M[REDACTED]nn Gray",
  elise_gabriel: "Elise Gabriel",
  julia_mulberry: "Julia Mulberry",
  bex_hyman: "Bex Hyman",
  addie_smith: "Addie Smith",
  anna_grace_underwood: "Anna Grace Underwood",
  janani_krishnan: "Janani Krishnan",
  courtney_shea: "Courtney Shea",
  veronica_reyes: "Veronica Reyes",
  lindsay_wood: "Lindsay Wood",
  juliet: "Juliet",
  etinosa_ogbevoen: "Etinosa Ogbevoen",
  dexter_phuong: "Dexter Phuong",

// ─────────────────────────────────────────────────────────────
// Layout: top-down tree walk
// Each node gets an x (center) and y (top) based on its subtree width
// ─────────────────────────────────────────────────────────────
const CARD_WIDTH = 220;
const H_GAP = 20;    // horizontal gap between sibling subtrees
const V_GAP = 60;    // vertical gap between levels
const PAD_X = 60;
const PAD_Y = 80;

// View mode: "accountability" = one box per seat (default); "org" = one box
// per person, seats folded together. NODES/ROOT_ID are what the layout renders.
let MODE = "accountability";
let NODES = SEATS;
let ROOT_ID = "visionary";

function buildTree() {
  const byId = {};
  NODES.forEach(s => { s.children = []; byId[s.id] = s; });
  NODES.forEach(s => {
    if (s.parent && byId[s.parent]) byId[s.parent].children.push(s);
  });
  return byId[ROOT_ID];
}

function computeSubtreeWidth(node) {
  if (node.children.length === 0) {
    node._subtreeWidth = CARD_WIDTH;
    return CARD_WIDTH;
  }
  let total = 0;
  node.children.forEach((c, i) => {
    total += computeSubtreeWidth(c);
    if (i > 0) total += H_GAP;
  });
  node._subtreeWidth = Math.max(CARD_WIDTH, total);
  return node._subtreeWidth;
}

function assignX(node, left) {
  node._x = left + node._subtreeWidth / 2 - CARD_WIDTH / 2;
  let childLeft = left;
  if (node.children.length > 0) {
    const childrenTotalWidth = node.children.reduce((acc, c, i) =>
      acc + c._subtreeWidth + (i > 0 ? H_GAP : 0), 0);
    childLeft = left + (node._subtreeWidth - childrenTotalWidth) / 2;
    node.children.forEach(c => {
      assignX(c, childLeft);
      childLeft += c._subtreeWidth + H_GAP;
    });
  }
}

function groupByDepth(node, depth, levels) {
  if (!levels[depth]) levels[depth] = [];
  levels[depth].push(node);
  node._depth = depth;
  node.children.forEach(c => groupByDepth(c, depth + 1, levels));
}

function initials(name) {
  return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

function renderCard(node) {
  const div = document.createElement("div");
  div.className = "card" + (node.hiring ? " hiring" : "") + (node.contractor ? " contractor" : "");
  div.dataset.seatId = node.id;
  div.style.left = node._x + "px";
  div.style.top = node._y + "px";

  // Org mode: one box per person, folded accountabilities with inline badges.
  if (node.isPerson) {
    const accBlock = (node.accItems && node.accItems.length)
      ? `<div class="section-label">Accountabilities</div><ul class="accountabilities">${node.accItems.map(a => {
          const marks = a.statuses.map(st => {
            const m = STATUS_META[st];
            return m ? `<span class="${m.markClass}">${m.label}</span>` : "";
          }).join("");
          return `<li${a.paused ? ' class="paused"' : ''}>${a.name}${marks}</li>`;
        }).join("")}</ul>`
      : "";
    const empTag = node.contractor ? `<span class="emp-tag">Contractor</span>` : "";
    div.innerHTML = `
      <div class="card-header">
        <div class="who">
          <div class="title">${node.title}</div>
          <div class="name">${node.roles}</div>
        </div>
      </div>
      ${accBlock}
      <div class="meta">${node.emp}${empTag}<br>${node.loc}</div>
    `;
    return div;
  }

  const occNames = node.occupants.map(o => OCCUPANTS[o] || o);
  const displayName = node.nameOverride || (node.hiring ? "HIRING" : (occNames.join(" / ") || "—"));
  const avatarInit = node.hiring ? "?" : (occNames[0] ? initials(occNames[0]) : "?");

  const marketBadge = node.market ? `<div class="market">${node.market}</div>` : "";
  const accBlock = node.acc && node.acc.length
    ? `<div class="section-label">Accountabilities</div><ul class="accountabilities">${node.acc.map(a => `<li>${a}</li>`).join("")}</ul>`
    : "";
  const kpisBlock = node.kpis && node.kpis.length
    ? `<div class="section-label">Key KPIs</div><div class="kpis">${node.kpis.join(" · ")}</div>`
    : "";

  div.innerHTML = `
    ${marketBadge}
    <div class="card-header">
      <div class="who">
        <div class="title">${node.title}</div>
        <div class="name">${displayName}</div>
      </div>
    </div>
    ${accBlock}
    ${kpisBlock}
    <div class="meta">${node.emp}<br>${node.loc}</div>
  `;
  return div;
}

function walkAll(node, fn) {
  fn(node);
  node.children.forEach(c => walkAll(c, fn));
}

function render() {
  const root = buildTree();
  computeSubtreeWidth(root);
  assignX(root, PAD_X);

  const canvas = document.getElementById("canvas");
  canvas.innerHTML = ""; // clear so re-render (mode switch) starts fresh

  // Pass 1: render all cards offscreen at correct x, measure actual heights
  const cardMap = new Map();
  walkAll(root, n => {
    const card = renderCard(n);
    card.style.top = "-10000px"; // offscreen for measurement
    canvas.appendChild(card);
    cardMap.set(n.id, card);
  });

  walkAll(root, n => {
    n._h = cardMap.get(n.id).offsetHeight;
  });

  // Pass 2: compute per-level y positions using max height at each depth
  const levels = {};
  groupByDepth(root, 0, levels);
  const maxDepth = Math.max(...Object.keys(levels).map(Number));

  let currentY = PAD_Y;
  for (let d = 0; d <= maxDepth; d++) {
    const nodes = levels[d];
    const maxH = Math.max(...nodes.map(n => n._h));
    nodes.forEach(n => { n._y = currentY; });
    currentY += maxH + V_GAP;
  }

  // Apply final y positions to cards
  walkAll(root, n => {
    cardMap.get(n.id).style.top = n._y + "px";
  });

  // Compute canvas size
  let maxX = 0, maxY = 0;
  walkAll(root, n => {
    maxX = Math.max(maxX, n._x + CARD_WIDTH);
    maxY = Math.max(maxY, n._y + n._h);
  });
  const canvasW = maxX + PAD_X;
  const canvasH = maxY + PAD_Y;
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";

  // Render connectors (SVG) using measured heights
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "connectors");
  svg.setAttribute("width", canvasW);
  svg.setAttribute("height", canvasH);
  walkAll(root, n => {
    n.children.forEach(c => {
      const x1 = n._x + CARD_WIDTH / 2;
      const y1 = n._y + n._h;
      const x2 = c._x + CARD_WIDTH / 2;
      const y2 = c._y;
      const midY = (y1 + y2) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${x1},${y1} L${x1},${midY} L${x2},${midY} L${x2},${y2}`);
      path.setAttribute("stroke", "#5B7B6A");
      path.setAttribute("stroke-width", "1");
      path.setAttribute("fill", "none");
      path.setAttribute("opacity", "0.4");
      svg.appendChild(path);
    });
  });
  canvas.insertBefore(svg, canvas.firstChild);
}

// Pan & zoom
// ─────────────────────────────────────────────────────────────
const viewport = document.getElementById("viewport");
const canvasEl = document.getElementById("canvas");
const zoomReadout = document.getElementById("zoom-readout");

let scale = 1;
let tx = 0, ty = 0;
const MIN_SCALE = 0.1;
const MAX_SCALE = 3;

function applyTransform() {
  canvasEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomReadout.textContent = Math.round(scale * 100) + "%";
}

function zoomBy(factor, originX, originY) {
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  if (newScale === scale) return;
  // If an origin is provided (cursor position), zoom around it
  if (originX !== undefined && originY !== undefined) {
    const rect = viewport.getBoundingClientRect();
    const localX = originX - rect.left;
    const localY = originY - rect.top;
    // world point under cursor before zoom
    const worldX = (localX - tx) / scale;
    const worldY = (localY - ty) / scale;
    scale = newScale;
    // keep that world point under the cursor after zoom
    tx = localX - worldX * scale;
    ty = localY - worldY * scale;
  } else {
    // zoom around viewport center
    const rect = viewport.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const worldX = (cx - tx) / scale;
    const worldY = (cy - ty) / scale;
    scale = newScale;
    tx = cx - worldX * scale;
    ty = cy - worldY * scale;
  }
  applyTransform();
}

function fitToScreen() {
  const rect = viewport.getBoundingClientRect();
  const canvasW = canvasEl.offsetWidth;
  const canvasH = canvasEl.offsetHeight;
  const scaleX = (rect.width - 40) / canvasW;
  const scaleY = (rect.height - 40) / canvasH;
  scale = Math.min(scaleX, scaleY, MAX_SCALE);
  tx = (rect.width - canvasW * scale) / 2;
  ty = 20;
  applyTransform();
}

function resetView() {
  scale = 1;
  tx = 20;
  ty = 60;
  applyTransform();
}

// Click-and-drag panning
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let txStart = 0, tyStart = 0;

viewport.addEventListener("mousedown", (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  txStart = tx;
  tyStart = ty;
  viewport.classList.add("grabbing");
  canvasEl.classList.add("panning");
  e.preventDefault();
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  tx = txStart + (e.clientX - dragStartX);
  ty = tyStart + (e.clientY - dragStartY);
  applyTransform();
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  viewport.classList.remove("grabbing");
  canvasEl.classList.remove("panning");
});

// Wheel zoom (ctrl/cmd-wheel or pinch = zoom; bare wheel = pan).
// Listen on window so cmd-wheel / pinch zoom over the sidebar or pill
// gets blocked too — otherwise the browser does its default page zoom
// and visually scales the fixed elements along with everything else.
window.addEventListener("wheel", (e) => {
  const overViewport = viewport.contains(e.target) || e.target === viewport;
  if (e.ctrlKey || e.metaKey) {
    // Always prevent browser zoom anywhere on the page
    e.preventDefault();
    // Only route to canvas zoom when actually over the chart
    if (overViewport) {
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      zoomBy(factor, e.clientX, e.clientY);
    }
    return;
  }
  // Bare wheel: pan when over viewport, otherwise let the element scroll
  // (so the sidebar scrolls natively when its content overflows)
  if (overViewport) {
    e.preventDefault();
    tx -= e.deltaX;
    ty -= e.deltaY;
    applyTransform();
  }
}, { passive: false });

// Keyboard shortcuts
window.addEventListener("keydown", (e) => {
  if (e.key === "0") { resetView(); }
  else if (e.key === "f" || e.key === "F") { fitToScreen(); }
  else if (e.key === "=" || e.key === "+") { zoomBy(1.2); }
  else if (e.key === "-" || e.key === "_") { zoomBy(1/1.2); }
});

// Start: fit whole chart to screen
fitToScreen();

// Normalize a subtask's `episodes` into [{id, t}]; accepts plain id strings too.
function epAttachments(s) {

function seatsForEpisode(epId) {

// YouTube link for an episode, with optional timestamp deep link.
function episodeUrl(ep, t) {
  if (!ep || !ep.url) return null;
  return t ? ep.url + (ep.url.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(t) : ep.url;
}

// "Covered on" row for a subtask: lists every relevant episode. Released
// episodes link to YouTube (deep-linked when a timestamp is set); unreleased
// or link-pending episodes render as a muted, non-clickable tag.
function renderEpisodeLinks(s) {
  const atts = epAttachments(s);
  if (!atts.length) return "";
  const items = atts.map(a => {
    const ep = EPISODE_BY_ID[a.id];
    if (!ep) return "";
    const url = episodeUrl(ep, a.t);
    if (ep.released && url) {
      return `<a class="sb-ep-link" href="${url}" target="_blank" rel="noopener" title="${ep.title}">${ep.tag}${a.t ? " @ " + a.t : ""} ↗</a>`;
    }
    const state = ep.released ? "link pending" : "unreleased";
    return `<span class="sb-ep-link disabled" title="${ep.title}">${ep.tag} <span class="ep-link-state">(${state})</span></span>`;
  }).join("");
  return `<div class="sb-ep-links"><span class="sb-ep-links-label">Covered on</span>${items}</div>`;
}

// ACC_STATUS baseline (if any) and every state among its subtasks. So a line
// that's MANUAL overall but has one AI-ified subtask shows both. Returns []
// for an untagged line.
function accStatuses(seatId, accName) {
  const set = [];
  const explicit = (ACC_STATUS[seatId] || {})[accName];
  if (explicit) set.push(explicit);
  const subs = (ACC_DETAIL[seatId] || {})[accName];
  if (subs) subs.forEach(s => { const st = subStatus(s); if (st && !set.includes(st)) set.push(st); });

  const statuses = accStatuses(seatId, accName);
  return statuses.length > 0 && statuses.every(s => s === "paused");

  SEATS.forEach(s => { seatById[s.id] = s; });
  const depthOf = seat => { let d = 0, cur = seat; while (cur && cur.parent) { d++; cur = seatById[cur.parent]; } return d; };

  // Group seats by occupant (skip empty/hiring seats — no person there).
  const byPerson = {};
  SEATS.forEach(s => {
    const occ = s.occupants && s.occupants[0];
    if (!occ) return;
    (byPerson[occ] = byPerson[occ] || []).push(s);
  });

  const ORDER = { ai: 0, manual: 1, paused: 2 };
  const nodes = [];
  Object.entries(byPerson).forEach(([occ, seats]) => {
    seats.sort((a, b) => depthOf(a) - depthOf(b));
    const primary = seats[0];

    // Parent person = occupant of the parent seat of this person's top seat,
    // walking up past any seat the same person also holds.
    let parentOcc = null, cur = primary.parent ? seatById[primary.parent] : null, guard = 0;
    while (cur && guard < 30) {
      const o = cur.occupants && cur.occupants[0];
      if (o && o !== occ) { parentOcc = o; break; }
      cur = cur.parent ? seatById[cur.parent] : null;
      guard++;
    }

    // Fold accountabilities, deduped by name, statuses unioned across seats.
    const accMap = new Map();
    seats.forEach(s => (s.acc || []).forEach(name => {
      if (!accMap.has(name)) accMap.set(name, new Set());
      resolveStatuses(s.id, name).forEach(st => accMap.get(name).add(st));
    }));
    const accItems = [...accMap.entries()].map(([name, set]) => {
      const statuses = [...set].sort((a, b) => (ORDER[a] ?? 9) - (ORDER[b] ?? 9));
      return { name, statuses, paused: statuses.length > 0 && statuses.every(s => s === "paused") };
    });

    nodes.push({
      id: "person_" + occ,
      isPerson: true,
      title: OCCUPANTS[occ] || occ,
      roles: seats.map(s => s.title).join(" · "),
      parent: parentOcc ? ("person_" + parentOcc) : null,
      occupants: [occ],
      seatIds: seats.map(s => s.id),
      accItems,
      acc: accItems.map(a => a.name),
      emp: primary.emp || "",
      loc: primary.loc || "",
      contractor: !/^FULL TIME/i.test(primary.emp || "")
    });
  });
  return nodes;
}

function updateHeader() {
  const a = document.getElementById("tab-accountability");
  const o = document.getElementById("tab-org");
  if (a) a.classList.toggle("active", MODE === "accountability");
  if (o) o.classList.toggle("active", MODE === "org");
  const c = document.getElementById("node-count");
  if (c) c.textContent = (MODE === "org") ? (NODES.length + " people") : "52 seats";
}

function switchMode(mode) {
  if (mode === MODE) return;
  MODE = mode;
  if (mode === "org") {
    NODES = buildPeopleNodes();
    ROOT_ID = (NODES.find(n => n.parent === null) || NODES[0]).id;
  } else {
    NODES = SEATS;
    ROOT_ID = "visionary";
  }
  closeSidebar();
  if (activeEpisodeId) clearEpisode();
  render();
  applyMarks();
  updateHeader();
  fitToScreen();
}

// ── Label-visibility toggles ──────────────────────────────────
// One entry per status label. `on: false` would start it hidden.
// The paradigm generalizes: add a row to wire any future label.
const STATUS_TOGGLES = [
  { key: "ai",     label: "AI",     on: true },
  { key: "manual", label: "Manual", on: false },
  { key: "paused", label: "Paused", on: false }
];

(function buildLabelToggles() {
  const tray = document.getElementById("label-toggle-tray");
  STATUS_TOGGLES.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "label-toggle " + (t.on ? "on" : "off");
    btn.dataset.status = t.key;
    btn.innerHTML = `${t.label}<span class="toggle-state">${t.on ? "ON" : "OFF"}</span>`;
    document.body.classList.toggle("hide-" + t.key, !t.on);
    btn.addEventListener("click", () => {
      const on = !btn.classList.contains("on");
      btn.classList.toggle("on", on);
      btn.classList.toggle("off", !on);
      btn.querySelector(".toggle-state").textContent = on ? "ON" : "OFF";
      document.body.classList.toggle("hide-" + t.key, !on);
    });
    tray.appendChild(btn);
  });
})();

// Build pills — one per RELEASED episode, in order. Tag-only for a compact
// stack; full title shows on hover.
(function buildPills() {
  const tray = document.getElementById("ep-pill-tray");
  EPISODES.filter(e => e.released).forEach(ep => {
    const btn = document.createElement("button");
    btn.className = "ep-pill";
    btn.dataset.episodeId = ep.id;
    btn.title = ep.title || "";
    btn.textContent = ep.tag;
    btn.addEventListener("click", () => toggleEpisode(ep.id));
    tray.appendChild(btn);
  });
})();

function toggleEpisode(epId) {
  if (!EPISODE_BY_ID[epId]) return;
  if (activeEpisodeId === epId) {
    clearEpisode();
    return;
  }
  activeEpisodeId = epId;
  document.body.classList.add("highlight-mode");
  const seats = seatsForEpisode(epId);
  const hl = EPISODE_HIGHLIGHTS[epId];
  document.querySelectorAll(".card").forEach(card => {
    card.classList.remove("ep-highlighted", "ep-conductor");
    const sid = card.dataset.seatId;
    if (seats.has(sid)) card.classList.add("ep-highlighted");
    if (hl && hl.conductor === sid) card.classList.add("ep-conductor");
  });
  document.querySelectorAll(".ep-pill").forEach(p => {
    p.classList.toggle("active", p.dataset.episodeId === epId);
  });
}

function clearEpisode() {
  activeEpisodeId = null;
  document.body.classList.remove("highlight-mode");
  document.querySelectorAll(".card").forEach(card => {
    card.classList.remove("ep-highlighted", "ep-conductor");
  });
  document.querySelectorAll(".ep-pill").forEach(p => p.classList.remove("active"));
}

// Sidebar open / populate / close
// Build the accountability rows for one seat (shared by seat + person sidebars).
function buildAccRows(seatId) {
  const seat = SEATS.find(s => s.id === seatId);
  if (!seat) return "";
  const detail = ACC_DETAIL[seatId] || {};
  return (seat.acc || []).map(accName => {
    const subs = detail[accName];
    const tags = accStatuses(seatId, accName).map(st => {
      const meta = STATUS_META[st];
      return meta ? `<span class="${meta.badgeClass}">${meta.label}</span>` : "";
    }).join("");
    const pausedClass = isWhollyPaused(seatId, accName) ? " paused" : "";
    const movedFrom = (ACC_MOVED[seatId] || {})[accName];
    const movedMark = movedFrom ? `<span class="sb-moved-mark">↳ moved</span>` : "";
    const movedLine = movedFrom ? `<div class="sb-moved-note">${movedFrom}</div>` : "";
    if (!subs) {
      return `<div class="sb-acc-row${pausedClass}" onclick="toggleSub(this)"><div class="sb-acc-name">${accName}${tags}${movedMark}</div>${movedLine}</div>`;
    }
    const subItems = subs.map(s => {
      const st = subStatus(s);
      const meta = st ? STATUS_META[st] : null;
      const stClass = meta ? " " + meta.subClass : "";
      const badge = meta ? `<span class="${meta.badgeClass}">${meta.label}</span>` : "";
      const note = s.note ? `<div class="sb-sub-note${st ? " " + st : ""}">${s.note}</div>` : "";
      const epLinks = renderEpisodeLinks(s);
      return `
        <div class="sb-sub-item${stClass}">
          <span class="arrow">→</span>
          <span><span class="sub-name">${s.name}</span>${badge}</span>
        </div>
        ${note}
        ${epLinks}`;
    }).join("");
    return `
      <div class="sb-acc-row${pausedClass}" onclick="toggleSub(this)">
        <div class="sb-acc-name">${accName}${tags}${movedMark}</div>
        ${movedLine}
        <div class="sb-sub-items">${subItems}</div>
      </div>`;
  }).join("");
}

// Org mode: a person's sidebar stacks one section per role (seat) they hold.
function openPersonSidebar(personId) {
  const node = NODES.find(n => n.id === personId);
  if (!node) return;
  selectedSeatId = personId;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("selected", c.dataset.seatId === personId));
  const empTag = node.contractor ? `<span class="emp-tag">Contractor</span>` : "";
  const sections = node.seatIds.map(sid => {
    const seat = SEATS.find(s => s.id === sid);
    return `<div class="sb-role-label">${seat.title}</div><div class="sb-acc-block">${buildAccRows(sid)}</div>`;
  }).join("");
  document.getElementById("sidebar-body").innerHTML = `
    <div class="sb-seat-label">Person</div>
    <div class="sb-title">${node.title}</div>
    <div class="sb-occupant">${node.roles}</div>
    <div class="sb-meta">${node.emp}${empTag}<br>${node.loc}</div>
    ${sections}
  `;
  document.getElementById("sidebar").classList.add("open");
}

function openSidebar(seatId) {
  if (MODE === "org") { openPersonSidebar(seatId); return; }
  const seat = SEATS.find(s => s.id === seatId);
  if (!seat) return;
  selectedSeatId = seatId;
  document.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("selected", c.dataset.seatId === seatId);
  });

  const occNames = seat.occupants.map(o => OCCUPANTS[o] || o);
  const displayName = seat.nameOverride || (seat.hiring ? "HIRING" : (occNames.join(" / ") || "—"));
  const market = seat.market ? `<div class="sb-seat-label" style="color:var(--text-faint);margin-bottom:4px">${seat.market}</div>` : "";

  // Episode banner if this seat is in the active episode's highlight overlay
  let epBanner = "";
  if (activeEpisodeId) {
    const hl = EPISODE_HIGHLIGHTS[activeEpisodeId];
    const ep = EPISODE_BY_ID[activeEpisodeId];
    if (hl && hl.notes[seatId]) {
      epBanner = `
        <div class="sb-ep-banner">
          <div class="ep-tag">${ep.tag} · ${hl.label}</div>
          <div class="ep-text">${hl.notes[seatId]}</div>
        </div>`;
    }
  }

  const accRows = buildAccRows(seatId);

  const kpisBlock = (seat.kpis && seat.kpis.length)
    ? `<div class="sb-kpis"><div class="label">Key KPIs</div>${seat.kpis.join(" · ")}</div>`
    : "";

  const seatStatus = SEAT_STATUS[seatId];
  const seatBadge = (seatStatus && STATUS_META[seatStatus])
    ? `<span class="${STATUS_META[seatStatus].badgeClass}">${STATUS_META[seatStatus].label}</span>` : "";

  document.getElementById("sidebar-body").innerHTML = `
    ${market}
    <div class="sb-seat-label">Seat</div>
    <div class="sb-title">${seat.title}${seatBadge}</div>
    <div class="sb-occupant">${displayName}</div>
    <div class="sb-meta">${seat.emp}<br>${seat.loc}</div>
    ${epBanner}
    <div class="sb-acc-block">${accRows}</div>
    ${kpisBlock}
  `;
  document.getElementById("sidebar").classList.add("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  selectedSeatId = null;
  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
}

function toggleSub(rowEl) {
  const subs = rowEl.querySelector(".sb-sub-items");
  if (subs) subs.classList.toggle("revealed");
}

// Wire up card clicks. We do this AFTER render() ran, but cards are
// also re-rendered if the script is re-run. Use event delegation on canvas.
document.getElementById("canvas").addEventListener("click", (e) => {
  // Don't treat a drag-release as a click
  if (justDragged) { justDragged = false; return; }
  const card = e.target.closest(".card");
  if (!card) return;
  const seatId = card.dataset.seatId;
  if (seatId) openSidebar(seatId);
});

// Distinguish click from drag — only open sidebar on actual clicks
let justDragged = false;
let dragStartXForClick = 0, dragStartYForClick = 0;
viewport.addEventListener("mousedown", (e) => {
  dragStartXForClick = e.clientX;
  dragStartYForClick = e.clientY;
});
viewport.addEventListener("mouseup", (e) => {
  const dx = Math.abs(e.clientX - dragStartXForClick);
  const dy = Math.abs(e.clientY - dragStartYForClick);
  justDragged = (dx > 4 || dy > 4);
});

// ESC closes sidebar; also clears episode highlight
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeSidebar();
    if (activeEpisodeId) clearEpisode();
  }
});
</script>
